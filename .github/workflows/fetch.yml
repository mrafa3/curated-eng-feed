name: Fetch candidate posts

# Tuesday 11:00 UTC (5 a.m. Mountain), a day ahead of the Wednesday-morning curation run.
on:
  schedule:
    - cron: "0 11 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python scripts/fetch_candidates.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json
          git diff --cached --quiet || git commit -m "Fetch candidates $(date -u +%Y-%m-%d)"
          git push

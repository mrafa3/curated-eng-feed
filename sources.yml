# Blogs the weekly fetch pulls from. One entry per feed.
# To add a blog: copy an entry, change name and url. To pause one: comment it out.
# Feed entries below were confirmed working on 2026-09-26; page entries added 2026-10-09.

sources:
  - name: Netflix TechBlog
    url: https://netflixtechblog.com/feed
  - name: Airbnb Tech Blog
    url: https://airbnb.tech/feed
  - name: Booking.com ML & DS
    url: https://booking.ai/feed
  - name: Lyft Engineering
    url: https://eng.lyft.com/feed
  - name: Pinterest Engineering
    url: https://medium.com/feed/pinterest-engineering
  - name: Instacart Tech
    url: https://tech.instacart.com/feed
  - name: Spotify Engineering
    url: https://engineering.atspotify.com/feed/
  - name: Shopify Engineering
    url: https://shopify.engineering/blog.atom     # full archive, not just recent posts

  # Page sources: blogs with no RSS feed. The fetch reads the index page, takes the
  # newest post links whose path matches `pattern`, and reads each post for its
  # description and date. If a redesign breaks one, it shows up under "failures".
  - name: Anthropic Engineering
    url: https://www.anthropic.com/engineering
    type: page
    pattern: ^/engineering/[^/]+$
  - name: Notion Blog
    url: https://www.notion.com/blog
    type: page
    pattern: ^/blog/(?!topic/|page/)[^/]+$
  - name: Uber Engineering
    url: https://www.uber.com/us/en/blog/engineering/
    type: page
    pattern: ^/us/en/blog/(?!engineering$|advertising$|earn$|ride$|eat$|merchants$|business$|health$|higher-education$|transit$|community-support$)[^/]+$

# Not included: vendor blogs that mostly carry product launches and case studies.
#
# Not included, block automated access:
#   LinkedIn Engineering  - blocks automated access
#   DoorDash Engineering  - 403 on its feed and on its blog page (tested 2026-10-09)
